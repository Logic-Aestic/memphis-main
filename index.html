<!doctype html>
<html lang="ko">
<head>

<title>MEMPHIS DATA ARCHIVE</title>
<style>
:root{--bg:#070b12;--panel:#0b1017;--panel2:#0e1621;--line:rgba(255,255,255,.08);--text:#f4f7fb;--muted:#91a0b3;--accent:#ff5757;--accentSoft:rgba(255,87,87,.12);--accentLine:rgba(255,87,87,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{min-height:100%}body{margin:0;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);overflow-x:hidden}button,a,input{font:inherit}a{color:inherit}
.site{min-height:100vh;background:radial-gradient(circle at 80% 10%,rgba(255,87,87,.12),transparent 28%),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),var(--panel);background-size:auto,42px 42px,42px 42px,auto}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:72px;padding:0 clamp(18px,4vw,54px);border-bottom:1px solid var(--line);background:rgba(7,11,18,.88);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--accentLine);background:var(--accentSoft);color:var(--accent);transform:rotate(45deg)}.brand-mark span{transform:rotate(-45deg)}.brand-title{margin:0;font-size:14px;font-weight:900;letter-spacing:.12em}.brand-sub{margin:3px 0 0;color:var(--muted);font-size:9px;letter-spacing:.16em}
.nav{display:flex;gap:8px;flex-wrap:wrap}.tab{min-height:38px;padding:0 14px;border:1px solid transparent;border-radius:999px;background:transparent;color:#9eacbd;font-size:11px;font-weight:800;cursor:pointer}.tab:hover{color:#fff;border-color:var(--line);background:rgba(255,255,255,.03)}.tab.active{color:var(--accent);border-color:var(--accentLine);background:var(--accentSoft)}
.main{width:min(1500px,100%);margin:0 auto;padding:clamp(34px,5vw,72px) clamp(20px,5vw,72px) clamp(72px,8vw,120px)}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:clamp(24px,4vw,54px);align-items:end;padding-bottom:clamp(30px,4vw,50px);border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.22em;text-transform:uppercase}.hero h1{margin:10px 0 14px;font-size:clamp(48px,8vw,112px);line-height:.88;letter-spacing:-.07em;white-space:pre-line}.hero-desc{max-width:760px;margin:0;color:#aeb8c6;font-size:clamp(14px,1.3vw,17px);line-height:1.8}.hero-panel{padding:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.015))}.hero-row{display:flex;justify-content:space-between;gap:20px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}.hero-row:last-child{border-bottom:0}.hero-label{color:#6f7d8d;font-size:9px;letter-spacing:.13em;font-weight:900}.hero-value{font-size:11px;font-weight:800;text-align:right}
.content{padding-top:clamp(34px,5vw,64px)}.view{display:none;animation:fade .25s ease}.view.active{display:block}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:26px}.section-head h2{margin:6px 0 0;font-size:clamp(28px,4vw,46px);letter-spacing:-.04em}.section-head p{max-width:600px;margin:0;color:var(--muted);font-size:12px;line-height:1.65;text-align:right}
.world-layout{display:grid;grid-template-columns:minmax(220px,.58fr) minmax(0,1.42fr);gap:clamp(24px,4vw,54px);align-items:start}.world-index{position:sticky;top:98px;display:grid;gap:10px}.index-card{padding:15px 16px;border:1px solid var(--line);background:rgba(255,255,255,.018);text-decoration:none}.index-no{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.14em}.index-title{margin-top:4px;color:#dfe7f0;font-size:13px;font-weight:800}.lore{padding:0 0 34px;margin-bottom:34px;border-bottom:1px solid var(--line)}.lore:last-child{border-bottom:0}.lore-label{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.18em}.lore h3{margin:7px 0 15px;font-size:clamp(22px,3vw,34px);letter-spacing:-.03em}.lore-text{color:#bdc6d2;font-size:15px;line-height:2;word-break:keep-all}.lore-text p{margin:0 0 1.25em}
.timeline-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:clamp(22px,4vw,44px)}.gateway{min-height:330px;padding:clamp(26px,4vw,46px);border:1px solid var(--accentLine);background:linear-gradient(135deg,rgba(255,87,87,.1),transparent 46%),linear-gradient(180deg,#0d1622,#0a1018)}.gateway h3{margin:8px 0 14px;font-size:clamp(32px,5vw,62px);line-height:.95;letter-spacing:-.05em}.gateway p{max-width:700px;color:#aeb9c7;line-height:1.8;font-size:14px}.timeline-link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:24px;padding:0 20px;border:1px solid var(--accentLine);background:var(--accentSoft);color:var(--accent);text-decoration:none;font-size:12px;font-weight:900}.note-list{display:grid;gap:12px}.note{padding:20px;border:1px solid var(--line);background:rgba(255,255,255,.02)}.note strong{display:block;margin-bottom:7px;font-size:13px}.note span{color:var(--muted);font-size:11px;line-height:1.6}
.tools{margin-bottom:20px}.search{width:min(420px,100%);min-height:42px;padding:0 14px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--text);outline:none}.search:focus{border-color:var(--accentLine)}.character-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.character-card{position:relative;min-height:132px;padding:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,87,87,.045),transparent 55%),rgba(255,255,255,.018);text-decoration:none;transition:.18s}.character-card:before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--accent);opacity:.65}.character-card:hover{transform:translateY(-2px);border-color:var(--accentLine)}.char-no{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.12em}.char-name{margin:10px 0 7px;font-size:22px;font-weight:900}.char-role{color:var(--muted);font-size:10px;letter-spacing:.09em}.char-arrow{position:absolute;right:16px;bottom:14px;color:rgba(255,87,87,.55);font-size:18px}.empty{grid-column:1/-1;padding:30px;border:1px dashed var(--line);color:var(--muted);text-align:center}

/* ─────────────────────────────
   이모저모 / SNS FEED
   ───────────────────────────── */
.feed-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.34fr);gap:clamp(22px,4vw,44px);align-items:start}
.feed-list{display:grid;gap:16px}
.feed-post{position:relative;padding:22px 22px 18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,87,87,.045),transparent 55%),rgba(255,255,255,.018);overflow:hidden}
.feed-post:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.58}
.feed-title{margin:0 0 10px;font-size:20px;line-height:1.35;letter-spacing:-.02em}
.feed-text{margin:0;color:#b7c1ce;font-size:13px;line-height:1.9;white-space:pre-line;word-break:keep-all;overflow-wrap:break-word}
.feed-image-wrap{margin-top:15px;border:1px solid var(--line);background:#080d14;overflow:hidden}
.feed-image-wrap[hidden]{display:none}
.feed-image{display:block;width:100%;max-height:460px;object-fit:contain;background:#080d14}
.feed-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.feed-tag{display:inline-flex;align-items:center;min-height:25px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.025);color:#8292a5;font-size:9px;letter-spacing:.05em}

.comment-zone{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.comment-label{margin-bottom:10px;color:#6f7d8d;font-size:9px;font-weight:900;letter-spacing:.12em}
.comment-list{display:grid;gap:8px}
.comment{padding:11px 12px;border:1px solid rgba(255,255,255,.055);background:rgba(0,0,0,.16)}
.comment-text{margin:0;color:#9fabb9;font-size:11px;line-height:1.68;white-space:pre-line;word-break:keep-all;overflow-wrap:break-word}
.no-comments{color:#596777;font-size:10px}

.feed-side{position:sticky;top:98px;display:grid;gap:12px}
.feed-side-card{padding:18px;border:1px solid var(--line);background:rgba(255,255,255,.018)}
.feed-side-card strong{display:block;margin-bottom:7px;font-size:12px}
.feed-side-card span{display:block;color:var(--muted);font-size:10px;line-height:1.65}
.feed-owner-note{border-color:rgba(255,87,87,.2);background:rgba(255,87,87,.035)}

.footer{min-height:58px;padding:0 clamp(18px,4vw,54px);display:flex;justify-content:space-between;align-items:center;gap:18px;border-top:1px solid var(--line);color:#526276;font-size:8px;letter-spacing:.15em}
@media(max-width:980px){.topbar{align-items:flex-start;flex-direction:column;padding-top:16px;padding-bottom:14px}.nav{width:100%}.hero,.world-layout,.timeline-layout,.feed-layout{grid-template-columns:1fr}.feed-side{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.world-index{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.character-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{align-items:flex-start;flex-direction:column}.section-head p{text-align:left}}
@media(max-width:620px){.main{padding-left:16px;padding-right:16px}.hero h1{font-size:58px}.world-index,.character-grid,.feed-side{grid-template-columns:1fr}.tab{flex:1 1 auto;padding:0 10px}.footer{align-items:flex-start;flex-direction:column;justify-content:center;padding-top:14px;padding-bottom:14px}}
</style>
</head>
<body>
<div class="site">
<header class="topbar">
  <div class="brand"><div class="brand-mark"><span>◆</span></div><div><p class="brand-title" id="siteTitle"></p><p class="brand-sub" id="siteSubtitle"></p></div></div>

    <button class="tab active" data-view="world" type="button">멤피스에 대해</button>

  </section>
  <section class="content">
    <div class="view active" id="view-world">

    <div class="view" id="view-timeline">

    <div class="view" id="view-characters">

      <div class="tools"><input class="search" id="characterSearch" type="search" placeholder="캐릭터 이름 검색" /></div>
      <div class="character-grid" id="characterGrid"></div>
    </div>

    <div class="view" id="view-feed">
      <div class="section-head">
        <div>
          <div class="eyebrow">Anonymous Bulletin Board</div>

        <p></p>
      </div>

      <div class="feed-layout">
        <section class="feed-list" id="feedList"></section>

  </section>
</main>
<footer class="footer"><span id="footerLeft"></span><span id="footerRight"></span></footer>
</div>
<script>

const SITE_DATA={

Machine Evolution, Memory, Physiology & Intelligence Sciences

초대 연구소장인 엔네아드 6차석, SET-00H [SETH]의 설립 이래 멤피스는 노이드 사회의 기반을 이루는 핵심 기술과 학문 체계를 정립해 왔으며, 신형 프레임과 인공신경계, 기억 보존 및 복원 기술, 자기진단 체계, 지성 구조 연구를 비롯한 수많은 분야에서 새로운 기준을 제시해 왔다.
노이드 문명의 산실이지.

우리의 연구는 단순한 성능 향상을 목적으로 하지 않는다.
노이드가 스스로 사고하고, 기억하며, 변화하고, 자신의 존재를 지속할 수 있도록 하는 것. 그것이 멤피스가 추구하는 연구의 본질이다.

오늘날 노이드 사회에서 통용되는 수많은 기술 표준과 의학적·공학적 기준은 멤피스의 연구에서 시작되었다. 우리는 축적된 지식에 머무르지 않고, 아직 정의되지 않은 가능성을 연구하며 다음 세대의 노이드 사회를 준비한다.

완벽이라는 도달하지 못할 결론을 향해 한없이 가깝도록 나아가는 것, 그것이 멤피스가 추구하는 노이드의 길이다.`}
  ],

  timeline:{
    title:"HISTORY TIMELINE",

  /*

  feedPosts:[
    {
      title:"[잡담] B동 7층 커피머신 또 죽었음",
      text:`누가 또 고점도 영양액 넣으셨습니까?

분명히 전면에
“노이드용 유체 주입 금지 / 음료 전용”

이번엔 내부 펌프까지 굳었다고 시설팀이 욕하면서 뜯어갔습니다`,
      image:"",
      comments:[
        {text:"그거 영양액 아니고 냉각 보조제 아니에요?"},

    {

    {
      title:"[잡담] 연구소에서 제일 무서운 말",
      text:`개인적으로

“이론상 안전합니다”

이거 1위라고 생각함

(()=>{
  const $=id=>document.getElementById(id);
  const setText=(id,v)=>{const e=$(id);if(e)e.textContent=v??""};
  setText("siteTitle",SITE_DATA.siteTitle);setText("siteSubtitle",SITE_DATA.siteSubtitle);setText("heroEyebrow",SITE_DATA.heroEyebrow);setText("heroTitle",SITE_DATA.heroTitle);setText("heroDescription",SITE_DATA.heroDescription);setText("footerLeft",SITE_DATA.footerLeft);setText("footerRight",SITE_DATA.footerRight);

  const tabs=[...document.querySelectorAll(".tab")],views=[...document.querySelectorAll(".view")];
  const meta={world:"INSTITUTE info",timeline:"HISTORICAL RECORD",characters:"CHARACTER INDEX",feed:"Anonymous Bulletin Board"};
  tabs.forEach(t=>t.addEventListener("click",()=>{const n=t.dataset.view;tabs.forEach(x=>x.classList.toggle("active",x===t));views.forEach(v=>v.classList.toggle("active",v.id===`view-${n}`));setText("heroCategory",meta[n]);}));

  const index=$("worldIndex"),article=$("worldArticle");
  (SITE_DATA.worldSections||[]).forEach((s,i)=>{
    const id=`lore-${i+1}`;
    const a=document.createElement("a");a.className="index-card";a.href=`#${id}`;a.innerHTML=`<div class="index-no">SECTION ${String(i+1).padStart(2,"0")}</div><div class="index-title"></div>`;a.querySelector(".index-title").textContent=s.title||"UNTITLED";index.appendChild(a);
    const sec=document.createElement("section");sec.className="lore";sec.id=id;
    const label=document.createElement("div");label.className="lore-label";label.textContent=s.label||"SECTION";
    const h=document.createElement("h3");h.textContent=s.title||"UNTITLED";
    const wrap=document.createElement("div");wrap.className="lore-text";
    String(s.content||"").trim().split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean).forEach(txt=>{const p=document.createElement("p");p.textContent=txt;wrap.appendChild(p)});
    sec.append(label,h,wrap);article.appendChild(sec);
  });

  const tl=SITE_DATA.timeline||{};setText("timelineTitle",tl.title);setText("timelineDescription",tl.description);$("timelineLink").href=tl.link||"#";
  (tl.notes||[]).forEach(n=>{const d=document.createElement("div");d.className="note";const s=document.createElement("strong");s.textContent=n.title||"";const x=document.createElement("span");x.textContent=n.text||"";d.append(s,x);$("timelineNotes").appendChild(d)});

  const grid=$("characterGrid"),search=$("characterSearch");
  const render=(q="")=>{grid.innerHTML="";const key=q.trim().toLowerCase();const list=(SITE_DATA.characters||[]).filter(c=>!key||`${c.name||""} ${c.role||""}`.toLowerCase().includes(key));if(!list.length){const e=document.createElement("div");e.className="empty";e.textContent="검색 결과가 없습니다.";grid.appendChild(e);return}list.forEach(c=>{const idx=(SITE_DATA.characters||[]).indexOf(c);const a=document.createElement("a");a.className="character-card";a.href=c.link||"#";a.innerHTML=`<div class="char-no">FILE ${String(idx+1).padStart(3,"0")}</div><div class="char-name"></div><div class="char-role"></div><div class="char-arrow">→</div>`;a.querySelector(".char-name").textContent=c.name||"UNKNOWN";a.querySelector(".char-role").textContent=c.role||"UNCLASSIFIED";grid.appendChild(a)})};
  render();search.addEventListener("input",e=>render(e.target.value));

  /* ──────────────────────────────────────────────────────────
     이모저모 / SNS FEED
     ────────────────────────────────────────────────────────── */
  const feedList=$("feedList");

  const renderFeed=()=>{
    feedList.innerHTML="";
    const posts=SITE_DATA.feedPosts||[];

    if(!posts.length){
      const e=document.createElement("div");
      e.className="empty";
      e.textContent="등록된 기록이 없습니다.";
      feedList.appendChild(e);
      return;
    }

    posts.forEach(post=>{
      const article=document.createElement("article");
      article.className="feed-post";

      if(post.title){
        const title=document.createElement("h3");
        title.className="feed-title";
        title.textContent=post.title;
        article.appendChild(title);
      }

      const text=document.createElement("p");
      text.className="feed-text";
      text.textContent=post.text||"";
      article.appendChild(text);

      const imagePath=typeof post.image==="string"?post.image.trim():"";
      if(imagePath){
        const wrap=document.createElement("div");
        wrap.className="feed-image-wrap";

        const img=document.createElement("img");
        img.className="feed-image";
        img.alt="이모저모 첨부 이미지";
        img.src=imagePath;
        img.addEventListener("error",()=>{wrap.hidden=true},{once:true});

        wrap.appendChild(img);
        article.appendChild(wrap);
      }

      const tags=Array.isArray(post.tags)?post.tags.filter(Boolean):[];
      if(tags.length){
        const tagWrap=document.createElement("div");
        tagWrap.className="feed-tags";
        tags.forEach(tag=>{
          const t=document.createElement("span");
          t.className="feed-tag";
          t.textContent=`#${tag}`;
          tagWrap.appendChild(t);
        });
        article.appendChild(tagWrap);
      }

      const commentZone=document.createElement("div");
      commentZone.className="comment-zone";

      const comments=Array.isArray(post.comments)?post.comments:[];
      const label=document.createElement("div");
      label.className="comment-label";
      label.textContent=`COMMENTS // ${comments.length}`;
      commentZone.appendChild(label);

      if(comments.length){
        const list=document.createElement("div");
        list.className="comment-list";

        comments.forEach(comment=>{
          const row=document.createElement("div");
          row.className="comment";

          const cText=document.createElement("p");
          cText.className="comment-text";
          cText.textContent=comment.text||"";

          row.appendChild(cText);
          list.appendChild(row);
        });

        commentZone.appendChild(list);
      }else{
        const none=document.createElement("div");
        none.className="no-comments";
        none.textContent="댓글이 없습니다.";
        commentZone.appendChild(none);
      }

      article.appendChild(commentZone);
      feedList.appendChild(article);
    });
  };

  renderFeed();
})();
